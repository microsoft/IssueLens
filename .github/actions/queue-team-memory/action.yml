name: Dispatch coordinator workflow
description: Validate a target workflow and send one bounded dispatch with caller-supplied inputs.

inputs:
  dispatch-token:
    description: Target repository token with Contents read and Actions write access.
    required: false
    default: ${{ github.token }}
  coordinator-repository:
    description: Target owner/repository; defaults to the calling repository.
    required: false
    default: ${{ github.repository }}
  coordinator-workflow:
    description: Target YAML workflow basename, not a path or display name.
    required: true
  coordinator-ref:
    description: Target branch, independent of the source branch; defaults to the calling ref name.
    required: false
    default: ${{ github.ref_name }}
  workflow-inputs:
    description: JSON object containing at most ten string-valued workflow inputs; no job-specific fields are inferred.
    required: false
    default: '{}'

runs:
  using: composite
  steps:
    - name: Dispatch coordinator workflow
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
        COORDINATOR_REPOSITORY: ${{ inputs.coordinator-repository }}
        COORDINATOR_WORKFLOW: ${{ inputs.coordinator-workflow }}
        COORDINATOR_REF: ${{ inputs.coordinator-ref }}
        WORKFLOW_INPUTS: ${{ inputs.workflow-inputs }}
      run: python3 -I "$GITHUB_ACTION_PATH/dispatch.py"
