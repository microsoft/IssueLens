name: Queue IssueLens team memory
description: Preserve a validated default-branch push and dispatch its centrally queued team-memory workflow.

inputs:
  source-token:
    description: Source repository read token for push provenance validation.
    required: false
    default: ${{ github.token }}
  dispatch-token:
    description: Token for coordinator metadata reads and the single Actions dispatch POST.
    required: false
    default: ${{ github.token }}
  coordinator-repository:
    description: Coordinator owner/repository; supply all three coordinator inputs to enable generic dispatch.
    required: false
    default: ""
  coordinator-workflow:
    description: Coordinator workflow basename (for example team-memory-coordinator.yml); omit all target inputs for the IssueLens pilot.
    required: false
    default: ""
  coordinator-ref:
    description: Coordinator branch, independent of the source default branch; required with the other target inputs.
    required: false
    default: ""

outputs:
  source-artifact-id:
    description: Uploaded source artifact ID; its presence does not imply accepted dispatch or completed maintenance.
    value: ${{ steps.artifact.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - name: Prepare identity-only source event
      id: source
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.source-token }}
        COORDINATOR_REPOSITORY: ${{ inputs.coordinator-repository }}
        COORDINATOR_WORKFLOW: ${{ inputs.coordinator-workflow }}
        COORDINATOR_REF: ${{ inputs.coordinator-ref }}
      run: python3 -I "$GITHUB_ACTION_PATH/../issuelens/issuelens_action.py" prepare-dispatch

    - name: Preserve source event for the coordinator
      id: artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: issuelens-team-memory-source-${{ github.run_attempt }}
        path: ${{ steps.source.outputs.source-event-path }}
        if-no-files-found: error
        retention-days: 7

    - name: Queue team-memory request
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.source-token }}
        DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
        SOURCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        COORDINATOR_REPOSITORY: ${{ inputs.coordinator-repository }}
        COORDINATOR_WORKFLOW: ${{ inputs.coordinator-workflow }}
        COORDINATOR_REF: ${{ inputs.coordinator-ref }}
      run: python3 -I "$GITHUB_ACTION_PATH/../issuelens/issuelens_action.py" dispatch
