name: IssueLens
description: Prepare issue-loop, team-memory, or direct tasks and invoke an existing IssueLens agent.

inputs:
  request-type:
    description: Request adapter to use (issue-loop, team-memory, or task).
    required: true
  input:
    description: Explicit task text for request-type task; not accepted by event adapters.
    required: false
    default: ''
  issue-number:
    description: Issue number for manually dispatched issue-loop requests.
    required: false
    default: ''
  github-token:
    description: Caller repository read token; issue-loop needs Issues read and team-memory needs Contents and Pull requests read.
    required: false
    default: ${{ github.token }}
  pull-request-number:
    description: Merged PR number for manually dispatched team-memory requests.
    required: false
    default: ''
  source-repository:
    description: Canonical source owner/repository for coordinated reconciliation; defaults to the caller repository.
    required: false
    default: ''
  source-repositories:
    description: Trusted coordinator configuration mapping allowed source owner/repository names to numeric repository IDs; never forward dispatched inputs here.
    required: false
    default: '{}'
  source-github-token:
    description: >-
      Source read token for coordinated requests (Contents, Actions and Pull requests read).
      Defaults to the built-in GITHUB_TOKEN for same-repository and supported public
      cross-repository reads. Explicit overrides remain supported; an empty token fails.
      Dispatch writes still require target Actions write access.
    required: false
    default: ${{ github.token }}
  source-run-id:
    description: Source default-branch push run for reconciliation; requires attempt and before/after, not pull-request-number.
    required: false
    default: ''
  source-run-attempt:
    description: Source push run attempt; required with source-run-id.
    required: false
    default: ''
  push-before:
    description: Full nonzero ancestor SHA selecting the requested reconciliation range; not an attested original push boundary.
    required: false
    default: ''
  push-after:
    description: Full nonzero source run head SHA ending the requested reconciliation range.
    required: false
    default: ''
  azure-client-id:
    description: Client ID of the existing Azure OIDC identity.
    required: true
  azure-tenant-id:
    description: Azure tenant ID for the OIDC identity.
    required: true
  azure-subscription-id:
    description: Azure subscription ID for the OIDC login.
    required: true
  agent-url:
    description: Full HTTPS Foundry invocations endpoint.
    required: true
  agent-scope:
    description: Entra scope used to acquire the endpoint access token.
    required: true
  output-mode:
    description: Live log mode (hybrid includes agent text, activity shows statuses only, quiet disables stream display).
    required: false
    default: hybrid
  summary-mode:
    description: Job summary mode (full includes final agent text, status includes metrics/status only, none disables summary).
    required: false
    default: full

outputs:
  status:
    description: skipped, completed (stream success only), or validated team-memory outcome. Incomplete push batches fail the step after recording their outcome.
    value: ${{ steps.submit.outputs.status || steps.preflight.outputs.status }}
  skip-reason:
    description: Reason an ineligible event was skipped before Azure login.
    value: ${{ steps.preflight.outputs.skip-reason }}
  response-path:
    description: Runner-local UTF-8 final response for completed issue-loop/task requests or validated push-batch reports, including incomplete batches. Treat contents as untrusted.
    value: ${{ steps.submit.outputs.response-path }}
  wiki-repository:
    description: >-
      Reported wiki repository from a validated maintenance result, when available,
      including incomplete push batches. Its presence does not imply success;
      check status and the step outcome.
    value: ${{ steps.submit.outputs.wiki-repository }}
  wiki-sha:
    description: >-
      Full reported wiki publication or snapshot SHA from a validated maintenance
      result, when available, including incomplete push batches. Its presence
      does not imply success; check status and the step outcome.
    value: ${{ steps.submit.outputs.wiki-sha }}

runs:
  using: composite
  steps:
    - name: Prepare and validate request
      id: preflight
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_GH_TOKEN: ${{ inputs.source-github-token }}
        SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        SOURCE_REPOSITORIES: ${{ inputs.source-repositories }}
        REQUEST_TYPE: ${{ inputs.request-type }}
        TASK_INPUT: ${{ inputs.input }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        DISPATCH_PR: ${{ inputs.pull-request-number }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source-run-attempt }}
        PUSH_BEFORE: ${{ inputs.push-before }}
        PUSH_AFTER: ${{ inputs.push-after }}
        OUTPUT_MODE: ${{ inputs.output-mode }}
        SUMMARY_MODE: ${{ inputs.summary-mode }}
      run: python3 -I "$GITHUB_ACTION_PATH/issuelens_action.py" preflight

    - name: Azure login (OIDC) for the agent endpoint
      if: steps.preflight.outputs.eligible == 'true'
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Invoke IssueLens
      id: submit
      if: steps.preflight.outputs.eligible == 'true'
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        REQUEST_PATH: ${{ steps.preflight.outputs.request-path }}
        AGENT_URL: ${{ inputs.agent-url }}
        AGENT_SCOPE: ${{ inputs.agent-scope }}
        OUTPUT_MODE: ${{ inputs.output-mode }}
        SUMMARY_MODE: ${{ inputs.summary-mode }}
      run: python3 -I "$GITHUB_ACTION_PATH/issuelens_action.py" submit
