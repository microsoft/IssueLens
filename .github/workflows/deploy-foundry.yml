name: Deploy IssueLens to Foundry

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: issuelens-foundry-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Verify deployment prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Require a trusted default-branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "microsoft/IssueLens" ||
                "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ||
                "$GITHUB_SHA" != "$WORKFLOW_SHA" ]]; then
            echo "::error::Deploy only this repository's default-branch workflow."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check environment protections and exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/foundry_deploy.py preflight

  deploy:
    name: Deploy approved commit
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: foundry-production
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck prerequisites after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/foundry_deploy.py preflight
      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: '1.34.2'
      - name: Install the pinned Foundry deployment provider
        # This is the hosted-agent component of microsoft.foundry. Deployment
        # does not need the bundle's editor, project-provisioning, or toolbox CLIs.
        run: azd extension install azure.ai.agents --version 1.0.0-beta.16 --no-dependencies --no-prompt
      - name: Validate and prepare environment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.ISSUELENS_DEPLOY_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.ISSUELENS_DEPLOY_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.ISSUELENS_DEPLOY_AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
          AZURE_AI_MODEL_API_KEY: ${{ secrets.AZURE_AI_MODEL_API_KEY }}
          GITHUB_APP_ID: ${{ vars.ISSUELENS_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_SECRET_URI: ${{ vars.ISSUELENS_GITHUB_APP_PRIVATE_KEY_SECRET_URI }}
          TOOLBOX_ENDPOINT: ${{ vars.TOOLBOX_ENDPOINT }}
          MAILING_URL: ${{ secrets.MAILING_URL }}
          PERSONAL_NOTIFICATION_URL: ${{ secrets.PERSONAL_NOTIFICATION_URL }}
        run: python3 -I .github/scripts/foundry_deploy.py prepare
      - name: Azure login using the deployment identity
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.ISSUELENS_DEPLOY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ISSUELENS_DEPLOY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ISSUELENS_DEPLOY_AZURE_SUBSCRIPTION_ID }}
      - name: Configure azd for the existing target
        run: python3 -I .github/scripts/foundry_deploy.py configure
      - name: Publish with azd deploy
        id: publish
        run: python3 -I .github/scripts/foundry_deploy.py publish
      - name: Verify the new version and both protocols
        id: verify
        run: python3 -I .github/scripts/foundry_deploy.py verify
      - name: Record a sanitized deployment summary
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: python3 -I .github/scripts/foundry_deploy.py summary
      - name: Remove runner-local deployment state
        if: always()
        run: python3 -I .github/scripts/foundry_deploy.py cleanup
