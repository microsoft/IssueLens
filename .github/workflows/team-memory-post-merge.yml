name: Dispatch IssueLens team memory (opt-in)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: >-
      vars.ISSUELENS_TEAM_MEMORY_ENABLED == 'true' &&
      github.repository == 'microsoft/IssueLens' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Load action from trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/issuelens/
            /.github/actions/queue-team-memory/
          sparse-checkout-cone-mode: false

      - name: Queue team-memory request
        uses: ./.github/actions/queue-team-memory
