name: Dispatch IssueLens team memory (opt-in)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: >-
      vars.ISSUELENS_TEAM_MEMORY_ENABLED == 'true' &&
      github.repository == 'microsoft/IssueLens' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Load action from trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/issuelens/
            /.github/actions/queue-team-memory/
          sparse-checkout-cone-mode: false

      - name: Prepare identity-only team-memory source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/actions/issuelens/issuelens_action.py prepare-source

      - name: Preserve source event for the coordinator
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issuelens-team-memory-source-${{ github.run_attempt }}
          path: ${{ steps.source.outputs.source-event-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Queue team-memory request
        uses: ./.github/actions/queue-team-memory
        with:
          coordinator-workflow: team-memory-coordinator.yml
          workflow-inputs: >-
            {"source_run_id":"${{ github.run_id }}",
             "source_run_attempt":"${{ github.run_attempt }}",
             "source_artifact_id":"${{ steps.artifact.outputs.artifact-id }}"}
