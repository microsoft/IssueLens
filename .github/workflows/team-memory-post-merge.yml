name: IssueLens team memory (opt-in)

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged pull request to reconcile into team memory
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: issue-lens-team-memory-${{ github.repository }}-${{ github.event.after || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    if: >-
      vars.ISSUELENS_TEAM_MEMORY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Load action from trusted workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /.github/actions/issuelens/
          sparse-checkout-cone-mode: false

      - name: Maintain team memory
        uses: ./.github/actions/issuelens
        with:
          request-type: team-memory
          pull-request-number: ${{ inputs.pull_request_number }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          agent-url: ${{ secrets.ISSUELENS_AGENT_URL }}
          agent-scope: ${{ secrets.ISSUELENS_AGENT_SCOPE }}
