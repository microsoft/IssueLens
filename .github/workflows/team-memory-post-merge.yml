name: IssueLens team memory (opt-in)

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged pull request to reconcile into team memory
        required: true
        type: string
  pull_request_target:
    types: [closed]

concurrency:
  group: issue-lens-team-memory-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    if: >-
      vars.ISSUELENS_TEAM_MEMORY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Load action from trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /.github/actions/issuelens/
          sparse-checkout-cone-mode: false

      - name: Maintain team memory
        uses: ./.github/actions/issuelens
        with:
          request-type: team-memory
          pull-request-number: ${{ inputs.pull_request_number }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          agent-url: ${{ secrets.ISSUELENS_AGENT_URL }}
          agent-scope: ${{ secrets.ISSUELENS_AGENT_SCOPE }}
