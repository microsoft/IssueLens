name: Coordinate IssueLens team memory (opt-in)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source push workflow run ID (automatic dispatch only)
        required: false
        type: string
      source_run_attempt:
        description: Source workflow attempt (required with source_run_id)
        required: false
        type: string
      source_artifact_id:
        description: Immutable source event artifact ID (required with source_run_id)
        required: false
        type: string
      pull_request_number:
        description: Merged IssueLens PR to reconcile manually (instead of source inputs)
        required: false
        type: string

concurrency:
  group: issuelens-team-memory-wiki-microsoft-IssueLens
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    if: >-
      vars.ISSUELENS_TEAM_MEMORY_ENABLED == 'true' &&
      github.repository == 'microsoft/IssueLens' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - name: Load action from trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /.github/actions/issuelens/
          sparse-checkout-cone-mode: false

      - name: Maintain team memory
        uses: ./.github/actions/issuelens
        with:
          request-type: team-memory
          source-run-id: ${{ inputs.source_run_id }}
          source-run-attempt: ${{ inputs.source_run_attempt }}
          source-artifact-id: ${{ inputs.source_artifact_id }}
          pull-request-number: ${{ inputs.pull_request_number }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          agent-url: ${{ secrets.ISSUELENS_AGENT_URL }}
          agent-scope: ${{ secrets.ISSUELENS_AGENT_SCOPE }}
