name: Copilot CLI organization billing test

on:
  workflow_dispatch:

permissions:
  issues: read
  copilot-requests: write

jobs:
  probe:
    name: Request Copilot response
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Read an issue through local GitHub MCP
        env:
          GITHUB_MCP_TOKEN: ${{ github.token }}
          EXPECTED_TITLE: 'project setting "Store information about method parameters" cannot be changed for individual projects in a multi-root workspace'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet mcp==1.28.1
          python - <<'PY'
          import asyncio
          import html
          import json
          import os
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              parameters = StdioServerParameters(
                  command="docker",
                  args=[
                      "run",
                      "-i",
                      "--rm",
                      "-e",
                      "GITHUB_PERSONAL_ACCESS_TOKEN",
                      "-e",
                      "GITHUB_TOOLS",
                      "ghcr.io/github/github-mcp-server@sha256:c491ffdf6f4c85cb5397021bc655edb8ab825c6f5f568e7597d77a1bd7c4d308",
                  ],
                  env={
                      "GITHUB_PERSONAL_ACCESS_TOKEN": os.environ["GITHUB_MCP_TOKEN"],
                      "GITHUB_TOOLS": "issue_read",
                  },
              )
              async with stdio_client(parameters) as (reader, writer):
                  async with ClientSession(reader, writer) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      assert [tool.name for tool in tools.tools] == ["issue_read"]
                      result = await session.call_tool(
                          "issue_read",
                          {
                              "method": "get",
                              "owner": "microsoft",
                              "repo": "IssueLens",
                              "issue_number": 9,
                          },
                      )
                      assert not result.isError, result.content
                      text = next(item.text for item in result.content if hasattr(item, "text"))
                      issue = json.loads(text)
                      assert html.unescape(issue["title"]) == os.environ["EXPECTED_TITLE"], issue["title"]
                      print("GITHUB_MCP_ACTIONS_TOKEN_OK")

          asyncio.run(main())
          PY
