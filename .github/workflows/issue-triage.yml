# IssueLens issue loop via the hosted Foundry agent.
#
# Copy this file into a target repository at
# .github/workflows/issue-triage.yml. Repository-specific triage policy belongs
# in .github/issuelens.yml, not in this workflow.
#
# One-time setup in the repository (or organization, shared to selected repos):
#   Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#     AZURE_CLIENT_ID           Client ID of the OIDC identity (UAMI or app reg)
#     AZURE_TENANT_ID
#     AZURE_SUBSCRIPTION_ID
#     ISSUELENS_AGENT_URL       Full deployed invocations endpoint
#                               (.../protocols/invocations?api-version=...)
#     ISSUELENS_AGENT_SCOPE     Entra scope/resource for the endpoint token
#
# The hosted agent owns its Key Vault-backed GitHub App identity and mints
# repository-scoped tokens internally. Target repositories store no App private
# key. Agent endpoint access uses Azure OIDC.

name: IssueLens issue loop

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Keep one active run per issue without making unrelated issues compete for
  # the same default-branch concurrency group.
  group: issuelens-triage-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue event
        id: preflight
        env:
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          event_name="$GITHUB_EVENT_NAME"
          event_action=$(jq -r '.action // "workflow_dispatch"' "$GITHUB_EVENT_PATH")
          issue=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
          actor_login=$(jq -r '.sender.login // empty' "$GITHUB_EVENT_PATH")
          actor_type=$(jq -r '.sender.type // empty' "$GITHUB_EVENT_PATH")
          issue_author_association=$(jq -r '.issue.author_association // empty' "$GITHUB_EVENT_PATH")
          comment_id=$(jq -r '.comment.id // empty' "$GITHUB_EVENT_PATH")
          comment_author_login=$(jq -r '.comment.user.login // empty' "$GITHUB_EVENT_PATH")
          comment_author_association=$(jq -r '.comment.author_association // empty' "$GITHUB_EVENT_PATH")
          comment_author_type=$(jq -r '.comment.user.type // empty' "$GITHUB_EVENT_PATH")

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            issue="$DISPATCH_ISSUE"
            actor_login="${actor_login:-$GITHUB_ACTOR}"
            actor_type="${actor_type:-User}"
          fi

          eligible=true
          reason=accepted

          if [[ ! "$issue" =~ ^[1-9][0-9]*$ ]]; then
            eligible=false
            reason=invalid_issue_number
          elif [[ "$event_name" == "issue_comment" ]]; then
            if jq -e '.issue.pull_request != null' "$GITHUB_EVENT_PATH" >/dev/null; then
              eligible=false
              reason=pull_request_comment
            elif [[ "$actor_type" != "User" || "$comment_author_type" != "User" ]]; then
              eligible=false
              reason=bot_comment
            fi
          elif [[ "$event_name" == "issues" ]]; then
            if [[ "$event_action" != "opened" && "$event_action" != "reopened" ]]; then
              eligible=false
              reason=unsupported_issue_action
            fi
          elif [[ "$event_name" != "workflow_dispatch" ]]; then
            eligible=false
            reason=unsupported_event
          fi

          metadata=""
          if [[ "$eligible" == "true" ]]; then
            comment_added=false
            comment_edited=false
            manual_dispatch=false

            if [[ "$event_name" == "issue_comment" && "$event_action" == "created" ]]; then
              comment_added=true
            elif [[ "$event_name" == "issue_comment" && "$event_action" == "edited" ]]; then
              comment_edited=true
            elif [[ "$event_name" == "workflow_dispatch" ]]; then
              manual_dispatch=true
            fi

            metadata=$(jq -cn \
              --arg event_name "$event_name" \
              --arg event_action "$event_action" \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson issue_number "$issue" \
              --arg actor_login "$actor_login" \
              --arg actor_type "$actor_type" \
              --arg issue_author_association "$issue_author_association" \
              --arg comment_id "$comment_id" \
              --arg comment_author_login "$comment_author_login" \
              --arg comment_author_association "$comment_author_association" \
              --argjson comment_added "$comment_added" \
              --argjson comment_edited "$comment_edited" \
              --argjson manual_dispatch "$manual_dispatch" \
              '{
                event_name: $event_name,
                event_action: $event_action,
                repository: $repository,
                issue_number: $issue_number,
                actor_login: $actor_login,
                actor_type: $actor_type,
                issue_author_association: (if $issue_author_association == "" then null else $issue_author_association end),
                comment_id: (if $comment_id == "" then null else ($comment_id | tonumber) end),
                comment_author_login: (if $comment_author_login == "" then null else $comment_author_login end),
                comment_author_association: (if $comment_author_association == "" then null else $comment_author_association end),
                comment_added: $comment_added,
                comment_edited: $comment_edited,
                manual_dispatch: $manual_dispatch
              }')
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "::notice title=IssueLens event preflight::$event_name/$event_action issue=${issue:-unknown} $reason"

      - name: Azure login (OIDC) for the agent endpoint
        if: steps.preflight.outputs.eligible == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Invoke IssueLens agent
        if: steps.preflight.outputs.eligible == 'true'
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.preflight.outputs.issue }}
          EVENT_METADATA: ${{ steps.preflight.outputs.metadata }}
          AGENT_URL: ${{ secrets.ISSUELENS_AGENT_URL }}
          AGENT_SCOPE: ${{ secrets.ISSUELENS_AGENT_SCOPE }}
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::issue_number must be a positive integer"
            exit 1
          fi

          input="Process the trusted IssueLens issue-loop event for ${REPO}#${ISSUE} under the global built-in command and trusted issue-loop contracts. "
          input+="Trusted event metadata: ${EVENT_METADATA}"

          payload=$(jq -cn --arg input "$input" '{input:$input}')

          agent_token=$(az account get-access-token \
            --scope "$AGENT_SCOPE" \
            --query accessToken \
            -o tsv)

          curl --fail-with-body -sS -N -X POST "$AGENT_URL" \
            -H "Authorization: Bearer $agent_token" \
            -H "Content-Type: application/json" \
            -d "$payload"