# IssueLens issue loop via the hosted Foundry agent.
#
# This repository loads the local action from the trusted workflow revision.
# External callers use the pinned remote action example in
# .github/actions/issuelens/README.md. Repository policy belongs in
# .github/issuelens.yml, not in this workflow.
#
# One-time setup in the repository (or organization, shared to selected repos):
#   Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#     AZURE_CLIENT_ID           Client ID of the OIDC identity (UAMI or app reg)
#     AZURE_TENANT_ID
#     AZURE_SUBSCRIPTION_ID
#     ISSUELENS_AGENT_URL       Full deployed invocations endpoint
#                               (.../protocols/invocations?api-version=...)
#     ISSUELENS_AGENT_SCOPE     Entra scope/resource for the endpoint token
#
# The hosted agent owns its Key Vault-backed GitHub App identity and mints
# repository-scoped tokens internally. Target repositories store no App private
# key. Agent endpoint access uses Azure OIDC.

name: IssueLens issue loop

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

permissions: {}

concurrency:
  # Keep one active run per issue without making unrelated issues compete for
  # the same default-branch concurrency group.
  group: issuelens-triage-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request == null &&
        github.event.sender.type == 'User' && github.event.comment.user.type == 'User')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: Load action from trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /.github/actions/issuelens/
          sparse-checkout-cone-mode: false

      - name: Process issue event
        uses: ./.github/actions/issuelens
        with:
          request-type: issue-loop
          issue-number: ${{ inputs.issue_number }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          agent-url: ${{ secrets.ISSUELENS_AGENT_URL }}
          agent-scope: ${{ secrets.ISSUELENS_AGENT_SCOPE }}