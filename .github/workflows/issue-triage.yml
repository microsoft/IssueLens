# IssueLens issue triage via the hosted Foundry agent.
#
# Copy this file into a target repository at
# .github/workflows/issue-triage.yml. Repository-specific triage policy belongs
# in .github/issuelens.yml, not in this workflow.
#
# One-time setup in the repository (or organization, shared to selected repos):
#   Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#     AZURE_CLIENT_ID           Client ID of the OIDC identity (UAMI or app reg)
#     AZURE_TENANT_ID
#     AZURE_SUBSCRIPTION_ID
#     ISSUELENS_AGENT_URL       Full deployed invocations endpoint
#                               (.../protocols/invocations?api-version=...)
#     ISSUELENS_AGENT_SCOPE     Entra scope/resource for the endpoint token
#
# The hosted agent owns its Key Vault-backed GitHub App identity and mints
# repository-scoped tokens internally. Target repositories store no App private
# key. Agent endpoint access uses Azure OIDC.

name: IssueLens issue triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: issuelens-triage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC) for the agent endpoint
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Invoke IssueLens agent
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          AGENT_URL: ${{ secrets.ISSUELENS_AGENT_URL }}
          AGENT_SCOPE: ${{ secrets.ISSUELENS_AGENT_SCOPE }}
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::issue_number must be a positive integer"
            exit 1
          fi

          input="Triage GitHub issue ${REPO}#${ISSUE} without closing it. "
          input+="Find and report potential duplicate or related issues. "
          input+="When a duplicate meets the required evidence threshold, add the existing 'duplicate' label, then apply other appropriate existing labels using the repository's configured labeling policy. "
          input+="Assign the issue to the best supported individual owner using the repository's configured assignment policy and historical patterns while preserving existing assignees. "
          input+="After completing the triage actions, post one concise reporter-facing comment that summarizes the findings and provides an actionable next step."

          payload=$(jq -cn --arg input "$input" '{input:$input}')

          agent_token=$(az account get-access-token \
            --scope "$AGENT_SCOPE" \
            --query accessToken \
            -o tsv)

          curl --fail-with-body -sS -N -X POST "$AGENT_URL" \
            -H "Authorization: Bearer $agent_token" \
            -H "Content-Type: application/json" \
            -d "$payload"