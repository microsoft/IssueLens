# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

name: IssueLens
kind: hosted
protocols:
  - protocol: invocations
    version: 2.0.0
  - protocol: responses
    version: 2.0.0
resources:
  cpu: '0.5'
  memory: 1.0Gi
environment_variables:
  # Model (inference) — Foundry BYOK. Key auth via AZURE_AI_MODEL_API_KEY
  # (no managed-identity model RBAC required).
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: AZURE_AI_MODEL_API_KEY
    value: ${AZURE_AI_MODEL_API_KEY}
  # Both protocols — GitHub App registration and Key Vault-backed private key.
  - name: GITHUB_APP_ID
    value: ${GITHUB_APP_ID}
  - name: GITHUB_APP_PRIVATE_KEY_SECRET_URI
    value: ${GITHUB_APP_PRIVATE_KEY_SECRET_URI}
  - name: ISSUELENS_AUTOMATION_USER_ID
    value: ${ISSUELENS_AUTOMATION_USER_ID}
  # Non-GitHub capabilities exposed by the Foundry toolbox.
  - name: TOOLBOX_ENDPOINT
    value: ${TOOLBOX_ENDPOINT}
  # Notifications — Logic App HTTP endpoints (contain SAS signatures; store as
  # secrets, e.g. via `azd env set` or a secret store).
  - name: MAILING_URL
    value: ${MAILING_URL}
  - name: PERSONAL_NOTIFICATION_URL
    value: ${PERSONAL_NOTIFICATION_URL}
description: >
  IssueLens — a GitHub issue-triage agent built on the GitHub Copilot SDK
  (CopilotClient). It serves the invocations protocol for automation (GitHub
  Actions) and the responses protocol for chat. It triages issues
  (hot/blocking/regression) and applies labels through a session-owned stdio
  MCP server backed by repository-scoped IssueLens GitHub App installation
  tokens. Non-GitHub notification capabilities may also be supplied by the
  Foundry toolbox. GitHub access never uses the toolbox.
metadata:
  tags:
    - AI Agent Hosting
    - GitHub Copilot SDK
    - Invocations Protocol
    - Responses Protocol
    - Issue Triage
