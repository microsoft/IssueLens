[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "issuelens-github-mcp"
version = "0.1.0"
description = "Repository-confined GitHub App MCP server for IssueLens"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.9.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0,<3",
    "PyJWT[crypto]>=2.9.0",
]

[project.scripts]
issuelens-github-mcp = "issuelens_github_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/issuelens_github_mcp"]
